name: 每日刷新纳指数据

on:
  schedule:
    # UTC 22:30 = 北京次工作日 06:30/07:30（美股收盘后），周一至周五运行
    - cron: '30 22 * * 1-5'
  workflow_dispatch:   # 允许在 Actions 页面手动触发

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install pillow numpy

      - name: 刷新数据 + 组装 + 部署
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_API_IP: ""   # 留空 -> 走 api.github.com 域名解析（沙箱才用硬编码 IP）
        run: |
          python build_snapshot.py
          python assemble.py
          python gh_deploy2.py

      - name: 校验线上版本（失败则重试 Pages 构建）
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          EXPECT=$(date -u +%Y.%m.%d)
          for i in 1 2 3 4 5 6; do
            sleep 30
            LIVE=$(curl -s "https://daydong-code.github.io/ndx-dca/index.html" | grep -o 'x-app-ver" content="[0-9.]*"' | grep -o '[0-9][0-9.]*' || true)
            echo "第${i}次校验: 线上=$LIVE 期望=$EXPECT"
            if [ "$LIVE" = "$EXPECT" ]; then
              echo "线上已是最新，校验通过"
              exit 0
            fi
          done
          echo "线上版本未更新，尝试重新请求 Pages 构建..."
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
            echo "重试$i: Pages build 请求返回 $CODE"
            sleep 60
            LIVE=$(curl -s "https://daydong-code.github.io/ndx-dca/index.html" | grep -o 'x-app-ver" content="[0-9.]*"' | grep -o '[0-9][0-9.]*' || true)
            if [ "$LIVE" = "$EXPECT" ]; then
              echo "补救成功，线上已更新"
              exit 0
            fi
          done
          echo "::warning::线上版本仍未更新，请手动检查 Pages 部署"
          exit 1
